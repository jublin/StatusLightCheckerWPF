name: Status Light .NET tool

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

env:
  Tool_Project: src/StatusLightChecker.Desktop/StatusLightChecker.Desktop.csproj
  Tool_Package_Dir: build/packages

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore tool
      run: dotnet restore $env:Tool_Project

    - name: Restore checks
      run: |
        dotnet restore tests/Companion.Checks/Companion.Checks.csproj
        dotnet restore tests/Desktop.Checks/Desktop.Checks.csproj

    - name: Set package version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_EVENT_NAME -eq 'release') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '2.0.0' }
        "Package_Version=$version" >> $env:GITHUB_ENV

    - name: Run protocol checks
      run: dotnet run --project tests/Companion.Checks/Companion.Checks.csproj --no-restore

    - name: Run desktop checks
      run: dotnet run --project tests/Desktop.Checks/Desktop.Checks.csproj --no-restore

    - name: Pack .NET tool
      run: dotnet pack $env:Tool_Project -c Release --no-restore -o $env:Tool_Package_Dir -p:PackageVersion=$env:Package_Version

    - name: Validate tool package
      run: dotnet tool install --tool-path .tool-test --add-source $env:Tool_Package_Dir StatusLightChecker.Companion --version $env:Package_Version --ignore-failed-sources

    - name: Publish .NET tool to NuGet
      if: github.event_name == 'release' && github.event.action == 'published'
      run: |
        $package = Get-ChildItem "$env:Tool_Package_Dir/*.nupkg" | Select-Object -First 1
        dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Upload .NET tool
      uses: actions/upload-artifact@v4
      with:
        name: StatusLightChecker.Companion
        path: build/packages/*.nupkg
